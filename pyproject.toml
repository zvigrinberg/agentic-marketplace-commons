[project]
name = "agentic-marketplace-commons"
version = "0.1.0"
description = "Monorepo workspace for shared agentic-marketplace Python packages"
readme = "README.md"
requires-python = ">=3.12"

# This root project is NOT published. It exists only to configure the uv workspace.
# Individual publishable packages live under packages/.
[tool.uv.workspace]
members = ["packages/*"]
